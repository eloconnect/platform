packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: true

# Mantém o pnpm-lock.yaml num documento só. Sem isso, o pnpm 12 grava antes uma
# parte com a versão do próprio pnpm, e o grafo de dependências do GitHub (de
# onde vêm os alertas do Dependabot) lê só essa parte. Efeito colateral: o pnpm
# não troca de versão sozinho, então use `corepack enable` (ver README).
pmOnFail: ignore

# Recusa a instalação com um Node fora do `engines` do package.json (mínimo
# 24.22.1, com as correções de segurança de outubro de 2026).
engineStrict: true
# Overrides temporários de segurança para dependências transitivas
# utilizadas pelo Express. Remover quando as dependências do NestJS
# passarem a fornecer versões corrigidas compatíveis.
overrides:
  body-parser: ^2.4.0
  multer: ^2.5.0
  zod: ^4.6.6
